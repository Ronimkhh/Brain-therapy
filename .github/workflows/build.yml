name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install platform
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Resolve dependencies
        run: ./gradlew :app:dependencies --no-daemon

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test --no-daemon --stacktrace 2>&1 | tee build-test.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TRAP-THEORY-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TRAP-THEORY-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRAP-THEORY-build-logs
          path: |
            build-debug.log
            build-release.log
            build-test.log
          if-no-files-found: warn
          retention-days: 7